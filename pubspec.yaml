name: anchor
description: "Anchor — Your Family. Secured. A privacy-first AI-assisted family digital vault."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Backend & Realtime
  supabase_flutter: ^2.5.2

  # Security & Cryptography
  flutter_secure_storage: ^9.0.0
  local_auth: ^2.2.0
  cryptography: ^2.7.0

  # AI & OCR
  google_mlkit_text_recognition: ^0.13.0
  google_generative_ai: ^0.4.0

  # UI, Icons, Charts & Animations
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1
  fl_chart: ^0.68.0
  flutter_animate: ^4.5.0

  # Media & File Handling
  file_picker: ^8.0.3
  image_picker: ^1.1.1
  pdf: ^3.10.8
  path_provider: ^2.1.3

  # Utilities
  intl: ^0.19.0
  uuid: ^4.4.0
  share_plus: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/images/

